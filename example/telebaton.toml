# Project configuration. Pick models available to your accounts before using each agent.
# Role defaults below use only Codex; the other harnesses are optional.
[roles]
implement = "codex"
feedback = ["codex"]
# Set to an agent alias to enable automatic review; /review <agent> also works manually.
review = ""
plan = "codex"
# chat defaults to plan; summary defaults to chat.
# To mix harnesses, replace the assignments above, for example:
# implement = "glm"
# feedback = ["dsf", "codex"]
# review = "opus"
# plan = "codex"

[agents.codex]
harness = "codex"
model = "your-model-id"
effort = "high"
tag = "codex"

# OpenCode: provider/model IDs and an optional variant.
[agents.glm]
harness = "opencode"
model = "zai-coding-plan/glm-5.4"
variant = "default"
tag = "glm54"

[agents.ds]
harness = "opencode"
model = "deepseek/deepseek-v4-pro"
variant = "default"
tag = "deepseek4pro"

[agents.dsf]
harness = "opencode"
model = "deepseek/deepseek-flash"
variant = "default"
tag = "deepseek41flash"

# Claude Code: model ID, optional effort and permission_mode.
[agents.opus]
harness = "claude"
model = "claude-opus-5-5"
effort = "medium"
# permission_mode = "auto"
tag = "opus55"

# Replace these commands when adapting this starter to your own project.
[gate]
check = "npm run check"
test = "npm test"

[flow]
# Defaults to the number of feedback agents; set 0 to skip feedback.
feedback_rounds = 1

[logs]
dir = "wlog"

# Project commands run only when explicitly requested.
[commands.verify]
cmd = "npm run check && npm test"
description = "run the example checks and tests"
aliases = ["checks"]

# Optional deployment and background-server examples; supply your own scripts first.
# [commands.deploy]
# cmd = "tools/deploy"
# description = "deploy the project"
# confirm = true
#
# [commands.serve]
# cmd = "tools/serve"
# description = "start the development server"
# background = true
# ready = "listening"
# aliases = ["server"]

# Optional prompt overrides. These are the defaults; remove this section to inherit them.
[prompts]
implement = "please do {id}"
review = "please review {id}"
fix = "please fix all issues, commit"
fix_notes = "please fix {notes}; then commit"
feedback = """
Check the work on {id}: the commits after {base} in this tree, made by another agent. Report \
only: do not edit files or commit. Go through:
- each requirement and validation step of {id} in PLAN.md (or its CHANGELOG.md entry if it \
moved there): done or not, with evidence from the diff or a command you ran
- comments in or next to the changed code that are out of date or break the project's rules
- claims in the commit messages or CHANGELOG.md that nothing in the diff, tests or logs backs up
- formatting of the touched files, and the tests covering them
- bugs you can show with a concrete input or a failing test

Give each finding a file:line and the change it needs. Skip style preferences and guesses. \
End with a line `VERDICT: clean` when nothing needs fixing, otherwise `VERDICT: findings`."""
feedback_again = """
The implementer answered your findings: its reply is below and its new commits are in the \
tree. Check the fixes and whether anything you raised is still open; drop findings it \
rejected for a sound reason. Same rules, same VERDICT line.

{reply}"""
feedback_fix = """
Another agent checked your work on {id} and reported the findings below. Fix the ones that \
hold in a new commit (do not amend); for each one you reject, say why in a line.

{findings}"""
continue = """
Your last turn stopped before it finished (an error, an interruption or a restart). Check where \
the work stands and carry on from there."""
gate_failed = """
The verification gate failed after your last turn (step `{step}`). Fix it and commit. \
Output tail:

```
{output}
```"""
plan = """
Planning discussion{topic}. You may read the repository, but edit only PLAN.md: no code \
changes and no commits. Discuss with me first; I will say when to write the items down."""
plan_done = """
Please write the agreed items into PLAN.md now and commit only PLAN.md, following the \
project's commit message rules. Validation for PLAN.md-only planning changes: format/check PLAN.md \
and inspect its diff. Do not run builds, test suites, or the full gate unless the user explicitly \
requests them. General end-of-iteration gate instructions do not apply to this planning-only commit."""
plan_read_only = """
A task is running in this tree right now ({running}), so this turn is read-only: draft the \
items in your reply instead of editing PLAN.md. They get written once the task is idle and \
I ask for it."""
plan_moved = """
Commits landed since your last turn:
{commits}
Re-read PLAN.md (a finished task moves its item to CHANGELOG.md) and check these changes against \
what we planned; point out any adjustments the items need."""
chat = """
This is a read-only chat about the project. Another agent may be working in this tree right \
now, so uncommitted changes may be theirs. Do not edit files or run anything that changes \
state.

{message}"""
summary = """
Read {log}: the log of the {role} session for {task}, which is {state}. It can be long, \
so start from the end and read back only as far as you need. Then tell me in a few short \
bullets: the goal, what is done, what it is doing right now, and any problems or open \
questions. Change nothing."""
maintenance_init = """
Inventory this repository and propose a maintainability review campaign {campaign}. {topic}
Read repository instructions, current source/test structure, contracts and pending PLAN.md work. \
Assign every reviewable area a primary chunk, including tests, tools and authored schemas/fixtures. \
Exclude generated output, dependencies, build trees, binary assets and historical logs. \
Split large subsystems by responsibility so each chunk fits one agent session with callers and tests. \
Include shared instructions, exclusions, a summary table, coverage gaps and detailed chunk sections. \
Each chunk must state explicit primary paths, responsibilities, related tests/contracts and constraints. \
Respect project restrictions, including any user-led areas. Do not schedule implementation tasks."""
maintenance = """
Review {id} for maintainability improvements at baseline {base}.

Read AGENTS.md, relevant contracts and baseline PLAN.md. Find unnecessary indirection, duplicated \
decisions/bookkeeping, unclear ownership/lifetimes/order, dead paths, overly specific code and \
abstractions whose cost exceeds their current benefit. Inspect callers, consumers, variants and tests. \
Prefer deletion, clear control flow and reuse of existing mechanisms. Generalize only for concrete \
existing uses. Preserve behavior and all project invariants; separate behavior changes. \
For test consolidation, map exact removed assertions and their failure modes to surviving coverage; \
otherwise propose an investigation. Size, age and line savings alone are not findings. \
Do not claim performance gains without measurements. There is no finding quota. \
For each finding give a stable ID prefixed {id}-{tag}-, a concrete title, baseline file:line/symbol \
evidence, maintenance cost, smallest useful change and code removed, why simpler, preserved invariants, \
affected tests and focused validation for later, pending PLAN overlap/dependencies, confidence and missing evidence."""
